services:
  - type: web
    name: food-rescue-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: food-rescue-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: food-rescue-db
    plan: free
